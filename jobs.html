<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find jobs | LocalLance</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <div class="wrap page-title">
    <h1>Find jobs</h1>
    <p class="muted">Open jobs from local small businesses. Sending a proposal is free.</p>
  </div>
  <div class="wrap cols side-left">
    <form class="card" id="filters">
      <div class="field"><label for="f-text">Search</label><input type="search" id="f-text" placeholder="Website, logo, Wi-Fi..."></div>
      <div class="field"><label for="f-category">Service</label><select id="f-category"><option value="">All services</option></select></div>
      <div class="field"><label for="f-suburb">Suburb</label><select id="f-suburb"><option value="">All suburbs</option></select></div>
      <div class="field"><label class="check"><input type="checkbox" id="f-onsite"> On-site jobs only</label></div>
      <div class="field"><label for="f-sort">Sort by</label><select id="f-sort"><option value="new">Newest first</option><option value="budget">Highest budget</option></select></div>
    </form>
    <div class="stack">
      <div id="promo"></div>
      <div class="muted" id="count"></div>
      <div id="job-list"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/jobs.js"></script>
</body>
</html>
